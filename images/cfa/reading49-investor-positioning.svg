<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Investor Positioning in Fixed Income</title>
  <desc id="desc">A spectrum showing how common investor types position across maturity and credit risk.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5b6478"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="18" fill="#fbfaf7"/>
  <text x="54" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2847">Investor Positioning</text>
  <text x="54" y="84" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5b6478">Different investor types naturally cluster by liability profile, liquidity need, and risk tolerance.</text>

  <line x1="150" y1="430" x2="850" y2="430" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="430" x2="150" y2="150" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="158" y="138" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6478">Higher credit risk</text>
  <text x="738" y="504" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6478">Longer maturity</text>

  <rect x="184" y="348" width="190" height="66" rx="10" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="279" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Corporations</text>
  <text x="279" y="395" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">CP, repo, ABCP</text>

  <rect x="386" y="326" width="176" height="66" rx="10" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <text x="474" y="351" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Central Banks</text>
  <text x="474" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">Treasury notes</text>

  <rect x="606" y="304" width="230" height="78" rx="10" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <text x="721" y="331" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Pension / Insurance</text>
  <text x="721" y="353" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">long-term IG assets</text>

  <rect x="606" y="172" width="234" height="78" rx="10" fill="#fff0f0" stroke="#a94c4c" stroke-width="2"/>
  <text x="723" y="199" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Hedge Funds</text>
  <text x="723" y="221" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">high yield, distressed debt</text>

  <path d="M230 338 C330 270, 460 252, 630 248" fill="none" stroke="#b08d57" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="365" y="254" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#b08d57">More return seeking</text>

  <line x1="184" y1="430" x2="184" y2="420" stroke="#5b6478" stroke-width="2"/>
  <line x1="520" y1="430" x2="520" y2="420" stroke="#5b6478" stroke-width="2"/>
  <line x1="820" y1="430" x2="820" y2="420" stroke="#5b6478" stroke-width="2"/>
  <text x="184" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">liquidity</text>
  <text x="520" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">policy / reserves</text>
  <text x="820" y="462" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">liability matching</text>
</svg>
