<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Investor Positioning in Fixed Income</title>
  <desc id="desc">A spectrum showing how common investor types position across maturity and credit risk.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#5b6478"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="18" fill="#fbfaf7"/>
  <text x="54" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2847">Investor Positioning</text>
  <text x="54" y="84" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5b6478">Different investor types naturally cluster by liability profile, liquidity need, and risk tolerance.</text>

  <line x1="140" y1="410" x2="850" y2="410" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="140" y1="410" x2="140" y2="125" stroke="#5b6478" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="804" y="446" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6478">Longer maturity</text>
  <text x="58" y="142" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6478" transform="rotate(-90 58 142)">More credit risk</text>

  <rect x="174" y="326" width="190" height="66" rx="10" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="269" y="351" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Corporations</text>
  <text x="269" y="373" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">CP, repo, ABCP</text>

  <rect x="365" y="303" width="176" height="66" rx="10" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <text x="453" y="328" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Central Banks</text>
  <text x="453" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">Treasury notes</text>

  <rect x="594" y="284" width="230" height="78" rx="10" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <text x="709" y="311" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Pension / Insurance</text>
  <text x="709" y="333" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">long-term IG assets</text>

  <rect x="582" y="166" width="234" height="78" rx="10" fill="#fff0f0" stroke="#a94c4c" stroke-width="2"/>
  <text x="699" y="193" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Hedge Funds</text>
  <text x="699" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">high yield, distressed debt</text>

  <path d="M220 318 C315 250, 430 230, 610 230" fill="none" stroke="#b08d57" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="345" y="232" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#b08d57">More return seeking</text>

  <line x1="170" y1="410" x2="170" y2="400" stroke="#5b6478" stroke-width="2"/>
  <line x1="500" y1="410" x2="500" y2="400" stroke="#5b6478" stroke-width="2"/>
  <line x1="820" y1="410" x2="820" y2="400" stroke="#5b6478" stroke-width="2"/>
  <text x="170" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">liquidity</text>
  <text x="500" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">policy / reserves</text>
  <text x="820" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">liability matching</text>
</svg>
