<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Macaulay Duration and Horizon Risk Tradeoff</title>
  <desc id="desc">A timeline showing that short horizons are dominated by price risk, long horizons by reinvestment risk, and Macaulay duration is the balancing point.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0f2847"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="18" fill="#fbfaf7"/>
  <text x="54" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2847">Macaulay Duration: The Risk Balance Point</text>
  <text x="54" y="84" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5b6478">The investment horizon determines whether price risk or reinvestment risk matters more.</text>

  <line x1="120" y1="270" x2="840" y2="270" stroke="#5b6478" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="120" y="305" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">short horizon</text>
  <text x="760" y="305" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">long horizon</text>

  <rect x="82" y="155" width="250" height="78" rx="12" fill="#fff0f0" stroke="#a94c4c" stroke-width="2"/>
  <text x="207" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f2847">Price Risk Dominates</text>
  <text x="207" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">sale price changes matter most</text>
  <line x1="207" y1="233" x2="207" y2="260" stroke="#a94c4c" stroke-width="2"/>

  <rect x="355" y="145" width="250" height="96" rx="14" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <text x="480" y="176" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2847">Macaulay Duration</text>
  <text x="480" y="203" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">price and reinvestment</text>
  <text x="480" y="226" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">effects offset most closely</text>
  <line x1="480" y1="241" x2="480" y2="270" stroke="#4c7899" stroke-width="2"/>
  <circle cx="480" cy="270" r="10" fill="#4c7899"/>

  <rect x="628" y="155" width="250" height="78" rx="12" fill="#fff8ea" stroke="#b08d57" stroke-width="2"/>
  <text x="753" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f2847">Reinvestment Risk Dominates</text>
  <text x="753" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">coupon reinvestment matters most</text>
  <line x1="753" y1="233" x2="753" y2="260" stroke="#b08d57" stroke-width="2"/>

  <rect x="138" y="360" width="684" height="86" rx="12" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="480" y="391" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Duration gap</text>
  <text x="480" y="418" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">Macaulay Duration - Investment Horizon</text>
  <text x="480" y="441" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">Positive gap: price risk. Negative gap: reinvestment risk.</text>
</svg>
