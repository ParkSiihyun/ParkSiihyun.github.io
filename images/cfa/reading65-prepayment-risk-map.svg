<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">MBS Prepayment Risk Map</title>
  <desc id="desc">A two-sided map showing how falling rates create contraction risk and rising rates create extension risk for mortgage-backed securities.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0f2847"/>
    </marker>
  </defs>
  <rect width="960" height="540" rx="18" fill="#fbfaf7"/>
  <text x="54" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2847">MBS Prepayment Risk Map</text>
  <text x="54" y="84" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5b6478">Mortgage borrowers can repay early, so MBS cash-flow timing changes with interest rates.</text>

  <rect x="70" y="145" width="360" height="260" rx="16" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <text x="250" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2847">Rates Fall</text>
  <text x="250" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">borrowers refinance more</text>
  <line x1="250" y1="230" x2="250" y2="278" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="135" y="285" width="230" height="48" rx="10" fill="#ffffff" stroke="#4c7899" stroke-width="2"/>
  <text x="250" y="315" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Prepayments Increase</text>
  <line x1="250" y1="333" x2="250" y2="358" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c7899">Contraction Risk</text>

  <rect x="530" y="145" width="360" height="260" rx="16" fill="#fff0f0" stroke="#a94c4c" stroke-width="2"/>
  <text x="710" y="182" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f2847">Rates Rise</text>
  <text x="710" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">borrowers refinance less</text>
  <line x1="710" y1="230" x2="710" y2="278" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="595" y="285" width="230" height="48" rx="10" fill="#ffffff" stroke="#a94c4c" stroke-width="2"/>
  <text x="710" y="315" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Prepayments Decrease</text>
  <line x1="710" y1="333" x2="710" y2="358" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#a94c4c">Extension Risk</text>

  <rect x="190" y="455" width="580" height="54" rx="12" fill="#fff8ea" stroke="#b08d57" stroke-width="2"/>
  <text x="480" y="478" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Exam shortcut</text>
  <text x="480" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">Falling rates shorten MBS cash flows; rising rates lengthen them.</text>
</svg>
