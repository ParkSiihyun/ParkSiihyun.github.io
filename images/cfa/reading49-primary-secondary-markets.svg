<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Primary and Secondary Bond Markets</title>
  <desc id="desc">A diagram comparing new bond issuance in the primary market with dealer-led trading in the secondary market.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0f2847"/>
    </marker>
  </defs>
  <rect width="960" height="500" rx="18" fill="#fbfaf7"/>
  <text x="54" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2847">Primary vs Secondary Markets</text>
  <text x="54" y="84" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5b6478">Primary market raises new capital for the issuer. Secondary market transfers existing bonds among investors.</text>

  <rect x="60" y="125" width="840" height="135" rx="14" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="88" y="158" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#b08d57">Primary Market</text>
  <rect x="100" y="182" width="150" height="48" rx="8" fill="#fff8ea" stroke="#b08d57"/>
  <text x="175" y="211" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Issuer</text>
  <rect x="395" y="178" width="170" height="56" rx="8" fill="#fff8ea" stroke="#b08d57"/>
  <text x="480" y="201" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Investment Bank</text>
  <text x="480" y="220" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6478">underwritten / best efforts</text>
  <rect x="710" y="182" width="150" height="48" rx="8" fill="#fff8ea" stroke="#b08d57"/>
  <text x="785" y="211" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Investors</text>
  <line x1="250" y1="206" x2="388" y2="206" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="206" x2="702" y2="206" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="313" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">new bonds</text>
  <text x="635" y="194" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">distribution</text>
  <path d="M710 230 C520 278, 290 278, 115 230" fill="none" stroke="#b08d57" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="420" y="260" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">cash proceeds return to issuer</text>

  <rect x="60" y="302" width="840" height="135" rx="14" fill="#ffffff" stroke="#4c7899" stroke-width="2"/>
  <text x="88" y="335" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#4c7899">Secondary Market</text>
  <rect x="100" y="360" width="150" height="48" rx="8" fill="#eef5fb" stroke="#4c7899"/>
  <text x="175" y="389" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Investor A</text>
  <rect x="390" y="354" width="180" height="60" rx="8" fill="#eef5fb" stroke="#4c7899"/>
  <text x="480" y="379" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Dealer / OTC</text>
  <text x="480" y="398" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6478">bid-ask spread</text>
  <rect x="710" y="360" width="150" height="48" rx="8" fill="#eef5fb" stroke="#4c7899"/>
  <text x="785" y="389" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Investor B</text>
  <line x1="250" y1="384" x2="382" y2="384" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="384" x2="702" y2="384" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="316" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">sell bond</text>
  <text x="636" y="372" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">buy bond</text>
</svg>
