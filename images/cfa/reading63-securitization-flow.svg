<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Fixed Income Securitization Flow</title>
  <desc id="desc">A simplified securitization structure showing borrowers, originator, SPE, servicer, and ABS investors.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#0f2847"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="18" fill="#fbfaf7"/>
  <text x="54" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2847">Securitization Flow</text>
  <text x="54" y="84" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5b6478">Loan cash flows are pooled, separated into an SPE, and transformed into securities.</text>

  <rect x="58" y="170" width="190" height="104" rx="14" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="153" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2847">Borrowers</text>
  <text x="153" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">make loan payments</text>
  <text x="153" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">from asset pool</text>

  <rect x="300" y="155" width="190" height="134" rx="14" fill="#fff8ea" stroke="#b08d57" stroke-width="2"/>
  <text x="395" y="191" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2847">Originator</text>
  <text x="395" y="218" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">creates loans</text>
  <text x="395" y="241" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">sells collateral</text>
  <text x="395" y="264" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">may service pool</text>

  <rect x="542" y="145" width="190" height="154" rx="16" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <text x="637" y="181" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2847">SPE</text>
  <text x="637" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">owns collateral</text>
  <text x="637" y="231" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">bankruptcy remote</text>
  <text x="637" y="254" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">issues ABS</text>

  <rect x="774" y="170" width="142" height="104" rx="14" fill="#ffffff" stroke="#4c7899" stroke-width="2"/>
  <text x="845" y="202" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f2847">Investors</text>
  <text x="845" y="229" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">buy ABS</text>
  <text x="845" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">receive cash flows</text>

  <line x1="248" y1="210" x2="292" y2="210" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">loans</text>
  <line x1="490" y1="210" x2="534" y2="210" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">collateral</text>
  <line x1="732" y1="210" x2="766" y2="210" stroke="#0f2847" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="749" y="192" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#5b6478">ABS</text>

  <path d="M845 286 C845 390, 220 390, 153 286" fill="none" stroke="#b08d57" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="500" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#b08d57">cash flows from collateral support investor payments</text>

  <rect x="204" y="435" width="552" height="58" rx="12" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="480" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Core idea</text>
  <text x="480" y="483" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">Securitization separates the asset pool from the originator and sells claims on the pool.</text>
</svg>
