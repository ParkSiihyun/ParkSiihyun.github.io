<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Repo Initial Margin and Haircut</title>
  <desc id="desc">A visual bar showing collateral market value, loan amount, initial margin, and haircut.</desc>
  <rect width="960" height="460" rx="18" fill="#fbfaf7"/>
  <text x="54" y="54" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f2847">Initial Margin vs Haircut</text>
  <text x="54" y="84" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5b6478">Example: bond market value $1,000,000 and initial margin 103%.</text>

  <rect x="110" y="145" width="740" height="74" rx="12" fill="#ffffff" stroke="#0f2847" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="110" y="145" width="718" height="74" rx="12" fill="#eef5fb" stroke="#4c7899" stroke-width="2"/>
  <rect x="828" y="145" width="22" height="74" rx="6" fill="#fff0f0" stroke="#a94c4c" stroke-width="2"/>
  <text x="469" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f2847">Loan Amount</text>
  <text x="469" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">$970,874</text>
  <text x="839" y="133" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#a94c4c">Haircut</text>
  <text x="839" y="241" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#a94c4c">2.91%</text>

  <line x1="110" y1="253" x2="850" y2="253" stroke="#5b6478" stroke-width="2"/>
  <line x1="110" y1="245" x2="110" y2="261" stroke="#5b6478" stroke-width="2"/>
  <line x1="850" y1="245" x2="850" y2="261" stroke="#5b6478" stroke-width="2"/>
  <text x="480" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Collateral Market Value = $1,000,000</text>

  <rect x="118" y="330" width="220" height="72" rx="12" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="228" y="358" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Loan Amount</text>
  <text x="228" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">Collateral MV / 1.03</text>

  <rect x="370" y="330" width="220" height="72" rx="12" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="480" y="358" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Initial Margin</text>
  <text x="480" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">Collateral / loan = 103%</text>

  <rect x="622" y="330" width="220" height="72" rx="12" fill="#ffffff" stroke="#b08d57" stroke-width="2"/>
  <text x="732" y="358" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f2847">Haircut</text>
  <text x="732" y="382" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5b6478">1 - 1 / initial margin</text>
</svg>
